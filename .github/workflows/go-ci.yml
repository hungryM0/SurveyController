name: Go CI

on:
  push:
    branches: [main, refactor/go]
  pull_request:

env:
  GO_VERSION: "1.26.5"
  BUN_VERSION: "1.3.14"

jobs:
  go-test:
    name: Go tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            packages/proxycore/go.sum
            packages/surveycore/go.sum
            apps/desktop/go.sum

      - name: Test core modules
        run: go test ./packages/proxycore/... ./packages/surveycore/...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop/frontend
        run: bun run build

      - name: Test desktop module
        working-directory: apps/desktop
        run: go test ./...

  frontend-test:
    name: Frontend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: apps/desktop/frontend
        run: bun run test

name: Go CI

on:
  push:
    branches: [main, refactor/go]
  pull_request:

env:
  GO_VERSION: "1.26.7"

permissions:
  contents: read

jobs:
  go-test:
    name: Go tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            SurveyCore/go.sum
            desktop/go.sum

      - name: Test SurveyCore
        working-directory: SurveyCore
        run: go test ./...

      - name: Test desktop module
        working-directory: desktop
        run: go test ./...

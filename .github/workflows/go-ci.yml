name: Go CI

on:
  push:
    branches: [main, refactor/go]
  pull_request:

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "22"

jobs:
  go-test:
    name: Go tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            packages/proxycore/go.sum
            packages/surveycore/go.sum
            apps/desktop/go.sum

      - name: Test core modules
        run: go test ./packages/proxycore/... ./packages/surveycore/...

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop/frontend
        run: npm run build

      - name: Test desktop module
        working-directory: apps/desktop
        run: go test ./...

  frontend-test:
    name: Frontend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci

      - name: Test frontend
        working-directory: apps/desktop/frontend
        run: npm test -- --run

name: Go CI

on:
  push:
    branches: [main, refactor/go]
  pull_request:

env:
  GO_VERSION: "1.26.5"

jobs:
  go-test:
    name: Go tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            packages/proxycore/go.sum
            packages/surveycore/go.sum
            apps/desktop/go.sum

      - name: Test core modules
        run: go test ./packages/proxycore/... ./packages/surveycore/...

      - name: Test desktop module
        working-directory: apps/desktop
        run: go test ./...

      - name: Build native WinUI shell
        working-directory: apps/desktop
        shell: pwsh
        run: ./build/native.ps1 -Action build -Configuration Release

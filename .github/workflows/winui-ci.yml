name: WinUI CI

on:
  push:
    branches: [main, refactor/go]
  pull_request:

env:
  GO_VERSION: "1.26.7"
  DOTNET_VERSION: "8.0.x"

permissions:
  contents: read

jobs:
  winui-test:
    name: Managed shell build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            SurveyCore/go.sum
            desktop/go.sum

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build managed WinUI shell and Go backend
        working-directory: desktop
        shell: pwsh
        run: ./build/native.ps1 -Action build -Configuration Release

      - name: Test shell services
        working-directory: desktop
        shell: pwsh
        run: ./build/native.ps1 -Action test -Configuration Release
